Stream.Description="<p><b>أنت جاهز للبث المباشر!</b></p><p>ليس لديك مخرج بث Aitum لـ TikTok؟ أنشئ واحداً من إعدادات Aitum واضبطه كما تريد. يمكن أن تكون قيمة عنوان URL ومفتاح البث مؤقتة حالياً.</p><p>اختر ذلك المخرج هنا لربطه بملف TikTok الشخصي، ثم ابدأ البث من Aitum كالمعتاد.</p><p><b>لا تستخدم Aitum؟ لا مشكلة!</b><br/>يمكنك أيضاً بدء وإنهاء جلسة LIVE يدوياً واستخدام بيانات البث الناتجة مع أي إعداد بث.</p>"
