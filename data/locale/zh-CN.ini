Account.Instructions="<p><b>你的帐户尚未开通电脑 LIVE。</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=en-US\">👉 在此申请电脑 LIVE 权限。</a></p><p>此页面直接来自 TikTok，即使它初看起来有些不同寻常。</p><p>选择<b>申请</b>，添加你在其他社交媒体平台上的一个个人资料，并上传截图作为证明。个人资料设置的截图通常足以让 TikTok 确认该帐户属于你。</p><p>申请后，使用<b>刷新帐户信息</b>查看是否已获批准。权限免费，通常只需几分钟，极少数情况下最长可达 72 小时。</p><p>一旦获得批准，你将自动进入下一步。</p>"
Common.False="否"
Stream.Title="3. 直播详情"
Stream.Description="<p><b>准备好直播！</b></p><p>还没有用于 TikTok 的 Aitum 推流输出？请先在 Aitum 设置中创建一个并按你的需要配置。推流 URL 和推流密钥暂时可以使用任意占位值。</p><p>在此选择该输出以关联你的 TikTok 个人资料。之后照常从 Aitum 开始推流，享受你的 LIVE！</p><p><b>不使用 Aitum？没问题！</b><br/>你也可以手动开始和结束 LIVE 会话，然后在任何推流设置中使用生成的凭据。</p>"
