Login.Instructions="<p><b>验证令牌</b>：如果你手动粘贴了令牌。</p><p><b>Streamlabs Desktop</b>：如果此电脑已安装 Streamlabs Desktop。</p><p><b>网页登录</b>：通过 TikTok 直接登录。*</p><p>*请阅读 <a href=\"https://streamlabs.com\">www.streamlabs.com</a> 上的规则，以及<a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">支持文章</a>了解详情。</p>"
