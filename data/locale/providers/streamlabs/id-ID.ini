Account.Instructions="<p><b>Your account is not enabled for PC LIVE yet.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=id-ID\">👉 Apply for PC LIVE access here.</a></p><p>This page is directly from TikTok, even if it looks a little unusual at first.</p><p>Select <b>Apply</b>, add one of your social media profiles, and upload a screenshot as proof. A screenshot from your profile settings is often enough for TikTok to confirm that the profile belongs to you.</p><p>Once you have applied, use <b>Refresh Account Info</b> to check whether you have been approved. Access is free and usually takes just a few minutes, though it can take up to 72 hours in rare cases.</p><p>As soon as you are approved, you will automatically move on to the next step here.</p>"
