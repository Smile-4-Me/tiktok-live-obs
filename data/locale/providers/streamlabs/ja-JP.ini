Account.Instructions="<p><b>このアカウントはまだ PC からの LIVE 配信を利用できません。</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=ja-JP\">👉 こちらから PC LIVE の利用を申請できます。</a></p><p>このページは TikTok の公式ページです。最初は少し見慣れない表示に見えるかもしれません。</p><p><b>申請</b>を選び、他の SNS のプロフィールを追加して、証明としてスクリーンショットをアップロードしてください。プロフィール設定のスクリーンショットだけで、アカウントの所有者であることを TikTok が確認できる場合が多いです。</p><p>申請後は、<b>アカウント情報を更新</b>で承認されたか確認できます。利用は無料で通常数分ですが、まれに 72 時間かかる場合があります。</p><p>承認されると、ここで自動的に次の手順へ進みます。</p>"
