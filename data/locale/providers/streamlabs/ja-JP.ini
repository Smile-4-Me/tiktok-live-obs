Login.Instructions="<p><b>トークンを確認</b>：トークンを手動で貼り付けた場合。</p><p><b>Streamlabs Desktop</b>：この PC に Streamlabs Desktop がインストールされている場合。</p><p><b>Web ログイン</b>：TikTok を通じて直接ログインする場合。*</p><p>*<a href=\"https://streamlabs.com\">www.streamlabs.com</a> のルールと、詳細については<a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">サポート記事</a>をご確認ください。</p>"
