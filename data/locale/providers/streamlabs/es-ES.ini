Account.Instructions="<p><b>Tu cuenta todavía no está habilitada para hacer LIVE desde PC.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=es-ES\">👉 Solicita aquí el acceso a LIVE desde PC.</a></p><p>Esta página procede directamente de TikTok, aunque al principio su aspecto pueda parecer un poco inusual.</p><p>Selecciona <b>Solicitar</b>, añade uno de tus perfiles de otra red social y sube una captura de pantalla como prueba. Una captura de la configuración de tu perfil suele ser suficiente para que TikTok confirme que la cuenta es tuya.</p><p>Después de solicitarlo, usa <b>Actualizar información de la cuenta</b> para comprobar si se aprobó. El acceso es gratuito y normalmente tarda unos minutos, aunque en casos poco habituales puede tardar hasta 72 horas.</p><p>Cuando se apruebe tu perfil, pasarás automáticamente al siguiente paso.</p>"
