Account.Instructions="<p><b>你的帐户尚未开通电脑 LIVE。</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=zh-CN\">👉 在此申请电脑 LIVE 权限。</a></p><p>此页面直接来自 TikTok，即使它初看起来有些不同寻常。</p><p>选择<b>申请</b>，添加你在其他社交媒体平台上的一个个人资料，并上传截图作为证明。个人资料设置的截图通常足以让 TikTok 确认该帐户属于你。</p><p>申请后，使用<b>刷新帐户信息</b>查看是否已获批准。权限免费，通常只需几分钟，极少数情况下最长可达 72 小时。</p><p>一旦获得批准，你将自动进入下一步。</p>"
