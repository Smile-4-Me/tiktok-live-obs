Account.Instructions="<p><b>Hesabın henüz bilgisayardan LIVE yayın yapmaya uygun değil.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=tr-TR\">👉 Bilgisayardan LIVE erişimi için buradan başvur.</a></p><p>Bu sayfa doğrudan TikTok’a ait, ilk bakışta biraz alışılmadık görünse bile.</p><p><b>Başvur</b> seçeneğine tıkla, başka bir sosyal medya platformundaki profillerinden birini ekle ve kanıt olarak ekran görüntüsü yükle. Profil ayarlarındaki bir ekran görüntüsü, TikTok’un hesabın sana ait olduğunu doğrulaması için genellikle yeterlidir.</p><p>Başvurudan sonra onaylanıp onaylanmadığını görmek için <b>Hesap bilgilerini yenile</b> seçeneğini kullan. Erişim ücretsizdir ve genellikle birkaç dakika sürer; nadiren 72 saate kadar uzayabilir.</p><p>Profilin onaylanır onaylanmaz burada otomatik olarak sonraki adıma geçersin.</p>"
