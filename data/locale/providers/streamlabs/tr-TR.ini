Login.Instructions="<p><b>Belirteci doğrula</b>: bir belirteci manuel olarak yapıştırdıysan.</p><p><b>Streamlabs Desktop</b>: Streamlabs Desktop bu bilgisayarda yüklüyse.</p><p><b>Web girişi</b>: doğrudan TikTok üzerinden giriş yapmak için.*</p><p>*<a href=\"https://streamlabs.com\">www.streamlabs.com</a> adresindeki kuralları incele ve ayrıntılar için <a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">destek makalesini</a> oku.</p>"
