Account.Instructions="<p><b>Ваша учётная запись ещё не включена для LIVE с ПК.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=ru-RU\">👉 Подайте заявку на доступ к LIVE с ПК здесь.</a></p><p>Эта страница принадлежит TikTok, хотя сначала может выглядеть немного непривычно.</p><p>Нажмите <b>Подать заявку</b>, добавьте один из профилей в другой соцсети и загрузите скриншот как подтверждение. Скриншота настроек профиля обычно достаточно, чтобы TikTok подтвердил, что аккаунт ваш.</p><p>После заявки нажмите <b>Обновить сведения об учётной записи</b>, чтобы проверить одобрение. Доступ бесплатный и обычно занимает несколько минут, но в редких случаях — до 72 часов.</p><p>Как только профиль одобрят, вы автоматически перейдёте к следующему шагу.</p>"
