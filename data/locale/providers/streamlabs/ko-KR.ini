Login.Instructions="<p><b>토큰 확인</b>: 토큰을 직접 붙여넣은 경우.</p><p><b>Streamlabs Desktop</b>: 이 PC에 Streamlabs Desktop이 설치되어 있는 경우.</p><p><b>웹 로그인</b>: TikTok을 통해 직접 로그인하는 경우.*</p><p>*<a href=\"https://streamlabs.com\">www.streamlabs.com</a>의 규정과 <a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">지원 문서</a>를 확인하세요.</p>"
