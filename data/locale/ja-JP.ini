Account.Instructions="<p><b>このアカウントはまだ PC からの LIVE 配信を利用できません。</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=en-US\">👉 こちらから PC LIVE の利用を申請できます。</a></p><p>このページは TikTok の公式ページです。最初は少し見慣れない表示に見えるかもしれません。</p><p><b>申請</b>を選び、他の SNS のプロフィールを追加して、証明としてスクリーンショットをアップロードしてください。プロフィール設定のスクリーンショットだけで、アカウントの所有者であることを TikTok が確認できる場合が多いです。</p><p>申請後は、<b>アカウント情報を更新</b>で承認されたか確認できます。利用は無料で通常数分ですが、まれに 72 時間かかる場合があります。</p><p>承認されると、ここで自動的に次の手順へ進みます。</p>"
Common.False="いいえ"

Stream.Title="3. 配信の詳細"
Stream.Description="<p><b>ライブ配信の準備ができました！</b></p><p>TikTok 用の Aitum 配信出力がまだない場合は、Aitum の設定で作成し、好きなように設定してください。配信 URL と配信キーは、今のところ仮の値でかまいません。</p><p>ここでその出力を選び、TikTok プロフィールと紐付けます。その後はいつもどおり Aitum から配信を開始してください。</p><p><b>Aitum を使っていませんか？ 問題ありません！</b><br/>LIVE セッションを手動で開始・終了し、生成された認証情報を任意の配信環境で使うこともできます。</p>"
