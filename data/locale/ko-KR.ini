Stream.Title="3. 스트림 세부 정보"
Stream.Description="<p><b>라이브를 시작할 준비가 되었습니다!</b></p><p>TikTok용 Aitum 스트림 출력이 아직 없나요? Aitum 설정에서 하나를 만들고 원하는 대로 설정하세요. 스트림 URL과 키는 지금은 아무 임시 값이어도 됩니다.</p><p>여기에서 해당 출력을 선택해 TikTok 프로필과 연결하세요. 그다음 평소처럼 Aitum에서 스트림을 시작하면 됩니다.</p><p><b>Aitum을 사용하지 않나요? 문제없습니다!</b><br/>LIVE 세션을 수동으로 시작하고 종료한 뒤 생성된 자격 증명을 어떤 스트리밍 환경에서든 사용할 수 있습니다.</p>"
