Login.Instructions="<p><b>Token prüfen</b>: für einen manuell eingefügten Token.</p><p><b>Streamlabs Desktop</b>: wenn Streamlabs Desktop auf diesem PC installiert ist.</p><p><b>Web-Login</b>: um dich direkt über TikTok anzumelden.*</p><p>*Bitte schau dir die Regeln auf <a href=\"https://streamlabs.com\">www.streamlabs.com</a> an und lies für weitere Infos den <a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">Support-Artikel</a>.</p>"

