Account.Instructions="<p><b>Dein Account ist noch nicht für PC-LIVE freigeschaltet.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=de-DE\">👉 Hier kannst du deinen Account freischalten.</a></p><p>Die Seite kommt direkt von TikTok – auch wenn sie auf den ersten Blick etwas ungewöhnlich aussieht.</p><p>Klicke auf <b>„Bewerben“</b>, gib kurz ein Profil von einer anderen Social-Media-Plattform an und lade einen Screenshot als Nachweis hoch. Ein Screenshot aus der Profilverwaltung reicht oft schon, damit TikTok erkennt, dass das Profil dir gehört.</p><p>Danach kannst du über <b>„Kontoinformationen aktualisieren“</b> prüfen, ob dein Antrag genehmigt wurde. Die Freischaltung ist kostenlos und dauert meist nur ein paar Minuten – in seltenen Fällen bis zu 72 Stunden.</p><p>Sobald dein Profil freigeschaltet ist, geht es hier automatisch weiter.</p>"
Common.False="Nein"

Stream.Title="3. Stream-Details"
Stream.Description="<p><b>Bereit für deinen Live-Stream!</b></p><p>Du hast noch keine Aitum-Stream-Ausgabe für TikTok? Erstelle sie zuerst im Aitum-Setup und richte sie ganz nach deinen Wünschen ein. Stream-URL und Stream-Key können dabei beliebige Platzhalter sein.</p><p>Wähle die gewünschte Ausgabe hier aus, um dein TikTok-Profil damit zu verknüpfen. Starte deinen Stream danach wie gewohnt über Aitum und genieße dein Live!</p><p><b>Du nutzt kein Aitum? Kein Problem!</b><br/>Du kannst deine Live-Session auch manuell starten und beenden und die erzeugten Zugangsdaten überall zum Streamen nutzen.</p>"
