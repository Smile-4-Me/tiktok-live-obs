Login.Instructions="<p><b>Verificar token</b>: si has pegado un token manualmente.</p><p><b>Streamlabs Desktop</b>: si Streamlabs Desktop está instalado en este PC.</p><p><b>Inicio de sesión web</b>: para iniciar sesión directamente mediante TikTok.*</p><p>*Consulta las normas en <a href=\"https://streamlabs.com\">www.streamlabs.com</a> y lee el <a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">artículo de soporte</a> para más detalles.</p>"

