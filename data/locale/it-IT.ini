Account.Instructions="<p><b>Il tuo account non è ancora abilitato alle LIVE da PC.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=it-IT\">👉 Richiedi qui l’accesso alle LIVE da PC.</a></p><p>Questa pagina proviene direttamente da TikTok, anche se all’inizio potrebbe sembrare un po’ insolita.</p><p>Seleziona <b>Candidati</b>, aggiungi uno dei tuoi profili su un altro social network e carica uno screenshot come prova. Spesso basta uno screenshot delle impostazioni del profilo affinché TikTok possa confermare che l’account è tuo.</p><p>Dopo la richiesta, usa <b>Aggiorna informazioni account</b> per verificare l’approvazione. L’accesso è gratuito e di solito richiede pochi minuti, fino a 72 ore in rari casi.</p><p>Appena il profilo viene approvato, passerai automaticamente al passaggio successivo.</p>"
Common.False="No"

Stream.Title="3. Dettagli stream"
Stream.Description="<p><b>Pronto per andare in diretta!</b></p><p>Non hai ancora un output Aitum per TikTok? Creane uno nelle impostazioni di Aitum e configuralo come preferisci. Per ora l’URL e la chiave di stream possono essere valori segnaposto.</p><p>Seleziona qui quell’output per collegarlo al tuo profilo TikTok. Poi avvia lo stream da Aitum come sempre e goditi la LIVE!</p><p><b>Non usi Aitum? Nessun problema!</b><br/>Puoi anche avviare e terminare la sessione LIVE manualmente, quindi usare le credenziali generate con qualsiasi configurazione di streaming.</p>"
