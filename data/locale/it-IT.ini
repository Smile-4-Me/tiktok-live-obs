Login.Instructions="<p><b>Verifica token</b>: se hai incollato un token manualmente.</p><p><b>Streamlabs Desktop</b>: se Streamlabs Desktop è installato su questo PC.</p><p><b>Accesso web</b>: per accedere direttamente tramite TikTok.*</p><p>*Consulta le regole su <a href=\"https://streamlabs.com\">www.streamlabs.com</a> e leggi l’<a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">articolo di supporto</a> per maggiori dettagli.</p>"

