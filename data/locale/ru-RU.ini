Account.Refresh="Обновить сведения об учётной записи"
Account.Instructions="<p><b>Ваша учётная запись ещё не включена для LIVE с ПК.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=en-US\">👉 Подайте заявку на доступ к LIVE с ПК здесь.</a></p><p>Эта страница принадлежит TikTok, хотя сначала может выглядеть немного непривычно.</p><p>Нажмите <b>Подать заявку</b>, добавьте один из профилей в другой соцсети и загрузите скриншот как подтверждение. Скриншота настроек профиля обычно достаточно, чтобы TikTok подтвердил, что аккаунт ваш.</p><p>После заявки нажмите <b>Обновить сведения об учётной записи</b>, чтобы проверить одобрение. Доступ бесплатный и обычно занимает несколько минут, но в редких случаях — до 72 часов.</p><p>Как только профиль одобрят, вы автоматически перейдёте к следующему шагу.</p>"
Common.False="Нет"

Stream.Title="3. Параметры трансляции"
Stream.Description="<p><b>Всё готово к эфиру!</b></p><p>У вас ещё нет выхода Aitum для TikTok? Создайте его в настройках Aitum и настройте как хотите. URL и ключ трансляции пока могут быть любыми заполнителями.</p><p>Выберите здесь этот выход, чтобы связать его с профилем TikTok. Затем запускайте трансляцию из Aitum как обычно.</p><p><b>Не используете Aitum? Не проблема!</b><br/>Вы также можете вручную запустить и завершить LIVE-сессию, а затем использовать созданные данные в любой конфигурации трансляции.</p>"
