Login.Instructions="<p><b>Проверить токен</b>: если вы вставили токен вручную.</p><p><b>Streamlabs Desktop</b>: если Streamlabs Desktop установлен на этом ПК.</p><p><b>Вход через сайт</b>: чтобы войти напрямую через TikTok.*</p><p>*Ознакомьтесь с правилами на <a href=\"https://streamlabs.com\">www.streamlabs.com</a> и прочитайте <a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">статью поддержки</a>.</p>"

