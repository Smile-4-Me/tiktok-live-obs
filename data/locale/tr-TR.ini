Account.Refresh="Hesap bilgilerini yenile"
Account.Instructions="<p><b>Hesabın henüz bilgisayardan LIVE yayın yapmaya uygun değil.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=en-US\">👉 Bilgisayardan LIVE erişimi için buradan başvur.</a></p><p>Bu sayfa doğrudan TikTok’a ait, ilk bakışta biraz alışılmadık görünse bile.</p><p><b>Başvur</b> seçeneğine tıkla, başka bir sosyal medya platformundaki profillerinden birini ekle ve kanıt olarak ekran görüntüsü yükle. Profil ayarlarındaki bir ekran görüntüsü, TikTok’un hesabın sana ait olduğunu doğrulaması için genellikle yeterlidir.</p><p>Başvurudan sonra onaylanıp onaylanmadığını görmek için <b>Hesap bilgilerini yenile</b> seçeneğini kullan. Erişim ücretsizdir ve genellikle birkaç dakika sürer; nadiren 72 saate kadar uzayabilir.</p><p>Profilin onaylanır onaylanmaz burada otomatik olarak sonraki adıma geçersin.</p>"
Common.False="Hayır"

Stream.Title="3. Yayın ayrıntıları"
Stream.Description="<p><b>Canlı yayına hazırsın!</b></p><p>TikTok için henüz bir Aitum yayın çıkışın yok mu? Aitum Ayarları’ndan bir tane oluştur ve istediğin gibi yapılandır. Yayın URL’si ve yayın anahtarı şimdilik herhangi bir yer tutucu değer olabilir.</p><p>TikTok profilinle bağlamak için bu çıkışı buradan seç. Ardından yayını her zamanki gibi Aitum’dan başlat ve LIVE yayınının keyfini çıkar!</p><p><b>Aitum kullanmıyor musun? Sorun değil!</b><br/>LIVE oturumunu manuel olarak da başlatıp sonlandırabilir, sonra oluşturulan bilgileri istediğin yayın kurulumunda kullanabilirsin.</p>"
