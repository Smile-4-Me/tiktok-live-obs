Login.Instructions="<p><b>Vérifier le jeton</b> : si tu as saisi un jeton manuellement.</p><p><b>Streamlabs Desktop</b> : si Streamlabs Desktop est installé sur ce PC.</p><p><b>Connexion Web</b> : pour te connecter directement via TikTok.*</p><p>*Consulte les règles sur <a href=\"https://streamlabs.com\">www.streamlabs.com</a> et lis l’<a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">article d’assistance</a> pour plus de détails.</p>"

