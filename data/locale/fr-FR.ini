Account.Instructions="<p><b>Ton compte n’est pas encore activé pour les LIVE sur PC.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=fr-FR\">👉 Demande l’accès aux LIVE sur PC ici.</a></p><p>Cette page provient directement de TikTok, même si son apparence peut sembler un peu inhabituelle au premier abord.</p><p>Sélectionne <b>Postuler</b>, ajoute l’un de tes profils sur un autre réseau social et importe une capture d’écran comme justificatif. Une capture de tes paramètres de profil suffit souvent à TikTok pour confirmer que le compte t’appartient.</p><p>Après ta demande, utilise <b>Actualiser les informations du compte</b> pour vérifier si elle a été approuvée. L’accès est gratuit et prend généralement quelques minutes, jusqu’à 72 heures dans de rares cas.</p><p>Dès que ton profil est approuvé, tu passeras automatiquement à l’étape suivante.</p>"
Common.False="Non"

Stream.Title="3. Détails du stream"
Stream.Description="<p><b>Prêt à passer en direct !</b></p><p>Tu n’as pas encore de sortie Aitum pour TikTok ? Crée-en une dans les paramètres Aitum et configure-la comme tu le souhaites. L’URL et la clé de stream peuvent être des valeurs temporaires pour le moment.</p><p>Sélectionne cette sortie ici pour l’associer à ton profil TikTok. Lance ensuite ton stream depuis Aitum comme d’habitude et profite de ton LIVE !</p><p><b>Tu n’utilises pas Aitum ? Pas de souci !</b><br/>Tu peux aussi démarrer et arrêter ta session LIVE manuellement, puis utiliser les identifiants générés avec n’importe quelle configuration de stream.</p>"
