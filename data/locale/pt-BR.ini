Login.Instructions="<p><b>Verificar token</b>: se você colou um token manualmente.</p><p><b>Streamlabs Desktop</b>: se o Streamlabs Desktop estiver instalado neste PC.</p><p><b>Login pela web</b>: para entrar diretamente pelo TikTok.*</p><p>*Confira as regras em <a href=\"https://streamlabs.com\">www.streamlabs.com</a> e leia o <a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">artigo de suporte</a> para mais detalhes.</p>"

