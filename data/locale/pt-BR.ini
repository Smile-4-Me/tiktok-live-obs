Account.Instructions="<p><b>Sua conta ainda não está habilitada para LIVE no PC.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=pt-BR\">👉 Solicite o acesso à LIVE no PC aqui.</a></p><p>Esta página vem diretamente do TikTok, mesmo que à primeira vista pareça um pouco incomum.</p><p>Selecione <b>Solicitar</b>, adicione um de seus perfis em outra rede social e envie uma captura de tela como comprovante. Uma captura das configurações do seu perfil geralmente é suficiente para o TikTok confirmar que a conta é sua.</p><p>Depois de solicitar, use <b>Atualizar informações da conta</b> para verificar se houve aprovação. O acesso é gratuito e normalmente leva poucos minutos, mas em casos raros pode levar até 72 horas.</p><p>Assim que seu perfil for aprovado, você seguirá automaticamente para a próxima etapa.</p>"
Common.False="Não"

Stream.Title="3. Detalhes da transmissão"
Stream.Description="<p><b>Pronto para entrar ao vivo!</b></p><p>Ainda não tem uma saída do Aitum para o TikTok? Crie uma nas configurações do Aitum e configure como quiser. Por enquanto, a URL e a chave de transmissão podem ser valores de exemplo.</p><p>Selecione essa saída aqui para vinculá-la ao seu perfil do TikTok. Depois, inicie sua transmissão pelo Aitum como sempre e aproveite sua LIVE!</p><p><b>Não usa o Aitum? Sem problema!</b><br/>Você também pode iniciar e encerrar sua sessão LIVE manualmente e usar as credenciais geradas em qualquer configuração de transmissão.</p>"
