Stream.Description="<p><b>Всё готово к эфиру!</b></p><p>У вас ещё нет выхода Aitum для TikTok? Создайте его в настройках Aitum и настройте как хотите. URL и ключ трансляции пока могут быть любыми заполнителями.</p><p>Выберите здесь этот выход, чтобы связать его с профилем TikTok. Затем запускайте трансляцию из Aitum как обычно.</p><p><b>Не используете Aitum? Не проблема!</b><br/>Вы также можете вручную запустить и завершить LIVE-сессию, а затем использовать созданные данные в любой конфигурации трансляции.</p>"
