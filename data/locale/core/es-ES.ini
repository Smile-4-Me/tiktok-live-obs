Stream.Description="<p><b>¡Todo listo para emitir en directo!</b></p><p>¿Aún no tienes una salida de Aitum para TikTok? Créala en los ajustes de Aitum y configúrala como quieras. Por ahora, la URL y la clave de stream pueden ser valores de prueba.</p><p>Selecciona aquí esa salida para vincularla a tu perfil de TikTok. Después inicia tu stream desde Aitum como siempre y disfruta de tu LIVE.</p><p><b>¿No utilizas Aitum? ¡No pasa nada!</b><br/>También puedes iniciar y finalizar la sesión LIVE manualmente y usar las credenciales generadas para emitir desde cualquier configuración.</p>"
