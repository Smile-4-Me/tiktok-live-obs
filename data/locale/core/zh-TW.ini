Stream.Description="<p><b>已準備好直播！</b></p><p>還沒有 TikTok 專用的 Aitum 串流輸出嗎？請先在 Aitum 設定中建立並依需求設定。串流 URL 和串流金鑰暫時可以是任何預留值。</p><p>在這裡選擇該輸出來連結你的 TikTok 個人資料。之後照常從 Aitum 開始串流即可。</p><p><b>不使用 Aitum？沒問題！</b><br/>你也可以手動開始和結束 LIVE 工作階段，再把產生的憑證用於任何串流設定。</p>"
