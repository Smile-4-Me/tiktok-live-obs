Stream.Title="3. स्ट्रीम विवरण"
Stream.Description="<p><b>लाइव जाने के लिए तैयार!</b></p><p>क्या आपके पास TikTok के लिए Aitum स्ट्रीम आउटपुट नहीं है? Aitum सेटिंग्स में एक बनाएं और अपनी पसंद के अनुसार सेट करें। स्ट्रीम URL और स्ट्रीम कुंजी अभी कोई भी प्लेसहोल्डर मान हो सकते हैं।</p><p>अपने TikTok प्रोफ़ाइल से जोड़ने के लिए यहाँ वह आउटपुट चुनें। फिर हमेशा की तरह Aitum से अपनी स्ट्रीम शुरू करें।</p><p><b>Aitum इस्तेमाल नहीं करते? कोई बात नहीं!</b><br/>आप LIVE सत्र को मैन्युअल रूप से शुरू और समाप्त कर सकते हैं और बने हुए क्रेडेंशियल किसी भी स्ट्रीमिंग सेटअप में इस्तेमाल कर सकते हैं।</p>"
