Account.Instructions="<p><b>Your account is not enabled for PC LIVE yet.</b></p><p><a href=\"https://www.tiktok.com/falcon/live_g/live_access_pc_apply/intro/index.html?id=GL6399433079641606942&amp;lang=en-US\">👉 Apply for PC LIVE access here.</a></p><p>This page is directly from TikTok, even if it looks a little unusual at first.</p><p>Select <b>Apply</b>, add one of your social media profiles, and upload a screenshot as proof. A screenshot from your profile settings is often enough for TikTok to confirm that the profile belongs to you.</p><p>Once you have applied, use <b>Refresh Account Info</b> to check whether you have been approved. Access is free and usually takes just a few minutes, though it can take up to 72 hours in rare cases.</p><p>As soon as you are approved, you will automatically move on to the next step here.</p>"
Common.False="False"

Stream.Title="3. Stream details"
Stream.Description="<p><b>Ready to go live!</b></p><p>Don’t have an Aitum stream output for TikTok yet? Create one in Aitum Settings and set it up exactly how you like. The stream URL and stream key can be any placeholder values for now.</p><p>Select that output here to link it with your TikTok profile. Then start your stream from Aitum as usual and enjoy your LIVE!</p><p><b>Not using Aitum? No problem!</b><br/>You can also start and end your LIVE session manually, then use the generated credentials to stream from any setup.</p>"
