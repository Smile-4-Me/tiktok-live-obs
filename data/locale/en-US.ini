Login.Instructions="<p><b>Verify Token</b>: if you have pasted a token manually.</p><p><b>Streamlabs Desktop</b>: if Streamlabs Desktop is installed on this PC.</p><p><b>Web Login</b>: to sign in directly through TikTok.*</p><p>*Please review the rules at <a href=\"https://streamlabs.com\">www.streamlabs.com</a> and read the <a href=\"https://support.streamlabs.com/hc/en-us/articles/35259691237147-Streamlabs-x-TikTok-Streaming-Access-Revoked-Suspended\">support article</a> for more details.</p>"

